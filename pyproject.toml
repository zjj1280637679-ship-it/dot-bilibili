[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-bridge"
version = "0.2.0"
description = "Community typed dot-host Bilibili bridge with offline defaults"
requires-python = ">=3.12"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
bili-bridge = "bili_bridge.cli:main"

[tool.setuptools.package-data]
bili_bridge = ["fixture_data/*.html"]

[tool.setuptools.packages.find]
include = ["bili_bridge*"]
